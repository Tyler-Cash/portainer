x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
      labels: "com.docker.compose.service,com.docker.compose.project"

services:
  # ensure-zfs-datasets.sh creates /ssd/services/spoolman as root, and nothing in
  # the Ansible role sets ownership for any stack. Spoolman's entrypoint drops to
  # PUID via gosu *before* the app checks the data dir, so it cannot fix this
  # itself — it just exits with "Data directory is not writable". This runs as
  # root first and hands over a writable directory. Idempotent, exits immediately,
  # and survives the dataset ever being recreated.
  spoolman-init:
    <<: *logging
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    container_name: spoolman-init
    command: chown -R 568:568 /data
    restart: "no"
    volumes:
      - /ssd/services/spoolman:/data

  spoolman:
    <<: *logging
    depends_on:
      spoolman-init:
        condition: service_completed_successfully
    image: ghcr.io/donkie/spoolman:0.26.1@sha256:cf9b41e17b93ce7d4ca584d9809142f8918fd290f2cd7d3b8b12ff76c75482f0
    container_name: spoolman
    restart: unless-stopped
    networks:
      - homelab_default
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - /ssd/services/spoolman:/home/app/.local/share/spoolman
    environment:
      # Spoolman's entrypoint applies these via gosu. It drops root BEFORE the
      # app checks the data dir, so it cannot chown the mount itself — a fresh
      # dataset needs `sudo chown -R 568:568 /ssd/services/spoolman` on the host
      # once, or the app exits with "Data directory is not writable".
      - PUID=568
      - PGID=568
      - TZ=Australia/Sydney
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.spoolman.service=spoolman
      - traefik.http.routers.spoolman.rule=Host(`spoolman.tylercash.dev`) && (ClientIP(`10.0.0.0/8`) || ClientIP(`172.19.0.0/24`))
      - traefik.http.routers.spoolman.entrypoints=websecure
      - traefik.http.services.spoolman.loadbalancer.server.scheme=http
      - traefik.http.services.spoolman.loadbalancer.server.port=8000
      - traefik.http.routers.spoolman.tls.certresolver=leresolver
      - com.centurylinklabs.watchtower.enable=true

  # Print queue + spool management. Talks MQTT (TLS) and FTPS straight to the
  # printer, so Home Assistant is not in the path — unlike the SpoolmanSync
  # setup this replaced. Requires Developer Mode on the printer: Bambu firmware
  # >= 01.08.03 verifies the source of MQTT control commands and rejects
  # anything not signed by current Studio/Handy (HMS 0500-0500-0001-0007).
  #
  # Deviations from upstream's docker-compose.yml, all deliberate:
  #  - macvlan + bridge instead of network_mode: host. Upstream uses host mode
  #    so SSDP discovery gets L2 multicast; macvlan gives that without the
  #    container taking over the host's ports or breaking Traefik routing.
  #    See the networks block below.
  #  - Virtual printer enabled. No ports are published: on macvlan the VP owns
  #    its own address, so it binds 990/8883/3000/3002/2024-2026/50000+ there.
  #  - Bind mounts under /ssd/services/ rather than named volumes.
  bambuddy:
    <<: *logging
    # Virtual printer binds FTP on 990, below 1024.
    cap_add:
      - NET_BIND_SERVICE
    # Versions are 4-component (1.2.5.2), not semver — sorting tags as semver
    # silently picks 0.2.x as "newest".
    image: ghcr.io/maziggy/bambuddy:1.2.5.3@sha256:c670164aaa3b0c5af715ca00e9745cdf3a4d7d337fc11d96fc85180371952698
    container_name: bambuddy
    restart: unless-stopped
    depends_on:
      - spoolman
    # Two networks on purpose:
    #  - printer_lan (macvlan) gives Bambuddy its own MAC and a real LAN IP, so
    #    the virtual printer is a first-class L2 device. It binds and advertises
    #    10.0.90.254 itself, SSDP discovery reaches the slicer, and no host ports
    #    are published at all — the VP owns 990/8883/3000/3002/2024-2026/50000+
    #    on its own address rather than sharing the host's.
    #  - homelab_default keeps Traefik, spoolman and obico-ml reachable by
    #    container name. The usual macvlan caveat is that the Docker *host*
    #    cannot reach a macvlan container; Traefik is itself a container on the
    #    bridge, so this does not apply to it.
    networks:
      homelab_default:
      printer_lan:
        ipv4_address: 10.0.90.254
    deploy:
      resources:
        limits:
          memory: 1500M
    volumes:
      - /ssd/services/bambuddy/data:/app/data
      - /ssd/services/bambuddy/logs:/app/logs
    environment:
      # Bambuddy's entrypoint chowns /app/data and /app/logs as root before
      # dropping to PUID via gosu, so this needs no init container (unlike
      # spoolman above, which checks the directory after dropping privileges).
      - PUID=568
      - PGID=568
      - TZ=Australia/Sydney
      - PORT=8000
      # No VIRTUAL_PRINTER_PASV_ADDRESS: that existed to work around bridge-mode
      # NAT, where passive FTP would advertise an unreachable container IP. On
      # macvlan the VP binds a real routable address, so it advertises correctly
      # on its own.
    # Upstream notes SQLite WAL checkpointing plus MQTT teardown on shutdown;
    # Docker's default 10s SIGKILL is tight when that runs slowly.
    stop_grace_period: 30s
    healthcheck:
      # Upstream's own HEALTHCHECK hits /health; 127.0.0.1 rather than localhost
      # so a v4-only bind can't be missed via ::1.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      - traefik.enable=true
      # Required now that this container is on two networks. Without it Traefik
      # may pick the macvlan IP, which it cannot reach — that traffic routes via
      # the host, and the host cannot reach macvlan containers — giving a 502.
      # Same reason home-assistant sets it (it is on homelab_default + iot).
      - traefik.docker.network=homelab_default
      - traefik.http.routers.bambuddy.service=bambuddy
      - traefik.http.routers.bambuddy.rule=Host(`bambuddy.tylercash.dev`) && (ClientIP(`10.0.0.0/8`) || ClientIP(`172.19.0.0/24`))
      - traefik.http.routers.bambuddy.entrypoints=websecure
      - traefik.http.services.bambuddy.loadbalancer.server.scheme=http
      - traefik.http.services.bambuddy.loadbalancer.server.port=8000
      - traefik.http.routers.bambuddy.tls.certresolver=leresolver
      - com.centurylinklabs.watchtower.enable=true

  # Obico's failure-detection ML API. Bambuddy has first-class support for it
  # (watches the camera feed, smooths scores with a 30-frame warmup + EWM +
  # rolling means, then fires notify / pause / pause-and-off once per print), so
  # only this inference service is needed — not the full Obico server with its
  # Django app, Postgres, Redis and Celery workers.
  #
  # Built from source rather than pinned to a published image: the only ml_api
  # tag on Docker Hub is from 2019, and the base-* tags are build bases, not the
  # app. The git context is pinned to a commit so builds are reproducible and
  # Ansible's content-hash gate only rebuilds when that commit changes.
  # Renovate cannot track this — bump the SHA by hand.
  #
  # Not exposed via Traefik: only Bambuddy talks to it, over homelab_default.
  # No hostname means no DNS record and no Homepage entry.
  obico-ml:
    <<: *logging
    build:
      context: https://github.com/TheSpaghettiDetective/obico-server.git#49c0bc7001a3fd8d56297fc3032ba287bfe1d50b:ml_api
    container_name: obico-ml
    restart: unless-stopped
    networks:
      - homelab_default
    deploy:
      resources:
        limits:
          memory: 2000M
    environment:
      - DEBUG=False
      - FLASK_APP=server.py
      # Gates /p/ (ml_api/auth.py). /hc/ stays open, which is what the
      # healthcheck below uses.
      - ML_API_TOKEN=${ML_API_TOKEN}
    tty: true
    command: bash -c "gunicorn --bind 0.0.0.0:3333 --workers 1 wsgi"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3333/hc/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First start loads the model weights baked in at build time.
      start_period: 120s

  # Manyfold — self-hosted "library of record" for 3D models
  # (manyfold.tylercash.dev). This is the Option-A workflow: provenance is
  # captured two ways —
  #  1. Manyfold's built-in URL import: paste a Thingiverse / MyMiniFactory /
  #     Cults3D / Thangs model URL and it creates the model with the source
  #     link, metadata, images. (Printables is NOT supported by URL import.)
  #  2. The bambuddy-to-manyfold sync add-on (commented block below, Phase 2)
  #     pushes Bambuddy's print archive + file-manager library in, recreating
  #     folders as nested collections and enriching MakerWorld 3MFs with
  #     source/tags/cover.
  #
  # Deployed as its own three services (app + Postgres + Redis). The single app
  # container also runs the background workers — there is no separate worker
  # service (unlike dawarich's sidekiq).
  #
  # Pinned on ghcr rather than Docker Hub: Docker Hub's manyfold3d/manyfold only
  # publishes sha-/edge/nightly tags, so a semver tag + digest pin (what Renovate
  # tracks) is only possible on ghcr — same registry as spoolman above.

  # ensure-zfs-datasets.sh creates /ssd/services/manyfold as root and nothing in
  # the Ansible role sets ownership. Give the app a writable model-library dir
  # before it starts. Idempotent, exits immediately, survives dataset recreation
  # — same pattern as spoolman-init. (manyfold-db needs no equivalent: the
  # official Postgres entrypoint chowns PGDATA itself while still root.)
  manyfold-init:
    <<: *logging
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    container_name: manyfold-init
    command: chown -R 568:568 /models
    restart: "no"
    volumes:
      - /ssd/services/manyfold/models:/models

  manyfold-db:
    <<: *logging
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: manyfold-db
    restart: unless-stopped
    networks:
      - homelab_default
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - POSTGRES_USER=manyfold
      - POSTGRES_PASSWORD=${MANYFOLD_DB_PASSWORD}
      - POSTGRES_DB=manyfold
    volumes:
      - /ssd/databases/manyfold-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manyfold -d manyfold"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - com.centurylinklabs.watchtower.enable=true

  manyfold-redis:
    <<: *logging
    image: redis:7.4-alpine@sha256:1db42ccef14898aa29bae778452d567534b59c107129cbc1163fb552de184d3c
    container_name: manyfold-redis
    restart: unless-stopped
    networks:
      - homelab_default
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - com.centurylinklabs.watchtower.enable=true

  manyfold:
    <<: *logging
    image: ghcr.io/manyfold3d/manyfold:0.147.2@sha256:54b7f4e95f8a858d63c7b532ed18b41f2ba5baa36e39371c6f240fdad943379a
    container_name: manyfold
    restart: unless-stopped
    networks:
      - homelab_default
    depends_on:
      manyfold-init:
        condition: service_completed_successfully
      manyfold-db:
        condition: service_healthy
      manyfold-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1500M
    volumes:
      # Manyfold's own library — the sync add-on uploads over the API rather than
      # sharing a filesystem, so this is deliberately NOT Bambuddy's archive.
      # Register it in Manyfold's "new library" form as /models after first boot.
      - /ssd/services/manyfold/models:/models
    environment:
      - PUID=568
      - PGID=568
      - TZ=Australia/Sydney
      # Long random string; Rails uses it to sign sessions/cookies. Generate with
      # the image's `generate-secret` entrypoint or `openssl rand -hex 64`.
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - REDIS_URL=redis://manyfold-redis:6379/1
      # Discrete DATABASE_* vars — this image does not take a DATABASE_URL.
      - DATABASE_ADAPTER=postgresql
      - DATABASE_HOST=manyfold-db
      - DATABASE_PORT=5432
      - DATABASE_USER=manyfold
      - DATABASE_PASSWORD=${MANYFOLD_DB_PASSWORD}
      - DATABASE_NAME=manyfold
    healthcheck:
      # Ruby is always present in this s6-overlay image (curl/wget are not
      # guaranteed). Treat any HTTP < 500 as healthy so the login redirect
      # passes; rescue + 2>/dev/null so a probe that races first-boot migrations
      # exits 1 quietly instead of dumping a Net::HTTP backtrace into Portainer's
      # "Last output".
      test:
        - CMD-SHELL
        - >-
          ruby -rnet/http -e 'begin; exit(Net::HTTP.get_response(URI("http://127.0.0.1:3214/")).code.to_i < 500 ? 0 : 1); rescue; exit 1; end' 2>/dev/null
      interval: 30s
      timeout: 10s
      retries: 5
      # First boot runs Rails migrations ("Preparing database...") before Puma
      # binds 3214; that can take a couple of minutes on a cold database.
      start_period: 240s
    labels:
      - traefik.enable=true
      - traefik.http.routers.manyfold.service=manyfold
      - traefik.http.routers.manyfold.rule=Host(`manyfold.tylercash.dev`) && (ClientIP(`10.0.0.0/8`) || ClientIP(`172.19.0.0/24`))
      - traefik.http.routers.manyfold.entrypoints=websecure
      - traefik.http.services.manyfold.loadbalancer.server.scheme=http
      - traefik.http.services.manyfold.loadbalancer.server.port=3214
      - traefik.http.routers.manyfold.tls.certresolver=leresolver
      - com.centurylinklabs.watchtower.enable=true

  # === Phase 2: bambuddy-to-manyfold sync (community add-on) =================
  # Disabled until Manyfold is up and its OAuth app exists — that is why this is
  # a two-phase bring-up. To enable:
  #   1. In Manyfold, create the admin account and a library pointing at /models.
  #   2. Create an OAuth application (grant: client_credentials) with the
  #      **upload** scope (mandatory) and **delete** scope (only if you use
  #      --cleanup-empty). A personal access token can NOT carry the upload
  #      scope — the script probes on startup and exits with instructions if it
  #      is missing.
  #   3. In Bambuddy, create an API key for BAMBUDDY_API_KEY.
  #   4. `task edit STACK=spoolman` and add MANYFOLD_OAUTH_CLIENT_ID,
  #      MANYFOLD_OAUTH_CLIENT_SECRET and BAMBUDDY_API_KEY.
  #   5. Uncomment this service, then add the DNS record + Homepage entry for
  #      manyfold-sync.tylercash.dev.
  #
  # The tool is one-shot at heart (keeps a local state file to skip already-synced
  # items; --force retries failed uploads) but ships a long-lived web GUI on 8089
  # for triggering syncs on demand — the variant that fits this stack's
  # restart:unless-stopped services. It uploads via Manyfold's resumable Tus API.
  #
  # manyfold-sync-init:
  #   <<: *logging
  #   image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
  #   container_name: manyfold-sync-init
  #   command: chown -R 568:568 /data
  #   restart: "no"
  #   volumes:
  #     - /ssd/services/bambuddy-to-manyfold/data:/data
  #
  # bambuddy-to-manyfold:
  #   <<: *logging
  #   image: ghcr.io/hibikipr/bambuddy_to_manyfold:1.3.3@sha256:7718290446dd0420aa92aaf827d461a86b5ad586090968c902830cf35b2b6b3d
  #   container_name: bambuddy-to-manyfold
  #   restart: unless-stopped
  #   networks:
  #     - homelab_default
  #   depends_on:
  #     manyfold-sync-init:
  #       condition: service_completed_successfully
  #     manyfold:
  #       condition: service_healthy
  #     bambuddy:
  #       condition: service_healthy
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 512M
  #   volumes:
  #     - /ssd/services/bambuddy-to-manyfold/data:/data
  #   environment:
  #     - PUID=568
  #     - PGID=568
  #     - TZ=Australia/Sydney
  #     # Reachable container-to-container over homelab_default.
  #     - BAMBUDDY_URL=http://bambuddy:8000
  #     - BAMBUDDY_API_KEY=${BAMBUDDY_API_KEY}
  #     - MANYFOLD_URL=http://manyfold:3214
  #     - MANYFOLD_CLIENT_ID=${MANYFOLD_OAUTH_CLIENT_ID}
  #     - MANYFOLD_CLIENT_SECRET=${MANYFOLD_OAUTH_CLIENT_SECRET}
  #     # 'upload' is mandatory; 'delete' only needed for --cleanup-empty.
  #     - MANYFOLD_SCOPES=public read write upload delete
  #     - MANYFOLD_LIBRARY_ID=1
  #     - SYNC_STATE_FILE=/data/bambuddy_sync_state.json
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8089/ || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.manyfold-sync.service=manyfold-sync
  #     - traefik.http.routers.manyfold-sync.rule=Host(`manyfold-sync.tylercash.dev`) && (ClientIP(`10.0.0.0/8`) || ClientIP(`172.19.0.0/24`))
  #     - traefik.http.routers.manyfold-sync.entrypoints=websecure
  #     - traefik.http.services.manyfold-sync.loadbalancer.server.scheme=http
  #     - traefik.http.services.manyfold-sync.loadbalancer.server.port=8089
  #     - traefik.http.routers.manyfold-sync.tls.certresolver=leresolver
  #     - com.centurylinklabs.watchtower.enable=true
  # ==========================================================================

networks:
  homelab_default:
    external: true

  # Gives Bambuddy its own MAC and LAN IP so the virtual printer behaves like a
  # real device: SSDP discovery works, it binds its own ports rather than
  # sharing the host's, and no advertise-IP or passive-FTP overrides are needed.
  #
  # ip_range pins Docker's allocation pool to the single address assigned above,
  # so it can never hand out an IP that UniFi's DHCP scope also owns. 10.0.90.254
  # must stay reserved/excluded there.
  #
  # Caveat worth remembering: the Docker host itself cannot reach a macvlan
  # container (kernel behaviour, not a misconfiguration). Container-to-container
  # traffic is unaffected, which is why Bambuddy stays on homelab_default too.
  printer_lan:
    driver: macvlan
    driver_opts:
      parent: enp3s0
    ipam:
      config:
        - subnet: 10.0.90.0/24
          gateway: 10.0.90.1
          ip_range: 10.0.90.254/32
