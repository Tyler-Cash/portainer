x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
      labels: "com.docker.compose.service,com.docker.compose.project"

services:
  dawarich_redis:
    <<: *logging
    image: redis:7.4-alpine@sha256:9702d01c1f10c3ea9f48211b4362e44f154ff02d063e6f7268eba804059f53bf
    container_name: dawarich_redis
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --appendonly no
    networks:
      - homelab_default
    volumes:
      - /ssd/services/dawarich/shared:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  dawarich_db:
    <<: *logging
    image: postgis/postgis:17-3.5-alpine@sha256:a7b31f03d1802e66d4d840ba31f20f9f3a8d3ffb2ba136596370a79356d6a327
    shm_size: 1G
    container_name: dawarich_db
    volumes:
      - /ssd/databases/dawarich-pg:/var/lib/postgresql/data
      - /ssd/services/dawarich/shared:/var/shared
    networks:
      - homelab_default
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=dawarich_production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dawarich_production"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  dawarich_app:
    <<: *logging
    image: freikin/dawarich:latest@sha256:fbc674ec6dbff19b1c9582aefe2e7867b871f42758d21cf339ec70283d51dea6
    container_name: dawarich_app
    volumes:
      - /ssd/services/dawarich/public:/var/app/public
      - /ssd/services/dawarich/watched:/var/app/tmp/imports/watched
      - /ssd/services/dawarich/storage:/var/app/storage
      - /ssd/databases/dawarich-pg:/dawarich_db_data
    networks:
      - homelab_default
    stdin_open: true
    tty: true
    entrypoint: web-entrypoint.sh
    # -b 0.0.0.0, not "::": the container has no non-loopback IPv6 interface, so
    # Puma logged "IPv6 bind requested but no non-loopback IPv6 interface was
    # detected" on every boot. Traefik reaches it over IPv4 on homelab_default.
    command: ["bin/rails", "server", "-p", "3000", "-b", "0.0.0.0"]
    restart: unless-stopped
    environment:
      - RAILS_ENV=production
      - REDIS_URL=redis://dawarich_redis:6379
      - DATABASE_HOST=dawarich_db
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=dawarich_production
      - APPLICATION_HOSTS=dawarich.tylercash.dev
      - TIME_ZONE=Australia/Sydney
      - APPLICATION_PROTOCOL=https
      - PROMETHEUS_EXPORTER_ENABLED=false
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - RAILS_LOG_TO_STDOUT=true
      - SELF_HOSTED=true
      - STORE_GEODATA=true
      - WEB_CONCURRENCY=1
    healthcheck:
      # X-Forwarded-Proto is required, not cosmetic. APPLICATION_PROTOCOL=https
      # makes Rails force SSL, so a plain request gets a 301 to https://. wget
      # follows redirects by default, so it then opens a TLS connection to
      # 127.0.0.1:3000 — which is plain HTTP — and Puma logs
      # "Are you trying to open an SSL connection to a non-SSL Puma?" once per
      # interval while the check fails. Traefik sets this header, which is why
      # the app works through it but the loopback probe did not.
      #
      # On failure, re-run verbosely so Portainer's "Last output" shows the
      # actual response instead of nothing: -q and grep -q discard everything.
      test:
        - CMD-SHELL
        - >-
          wget -qO- --header='X-Forwarded-Proto: https' http://127.0.0.1:3000/api/v1/health
          | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'
          || { wget -S -O- --header='X-Forwarded-Proto: https' http://127.0.0.1:3000/api/v1/health 2>&1 | head -20; exit 1; }
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich_db:
        condition: service_healthy
        restart: true
      dawarich_redis:
        condition: service_healthy
        restart: true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 4G
    labels:
      - traefik.enable=true
      - traefik.http.routers.dawarich.service=dawarich
      - traefik.http.routers.dawarich.rule=Host(`dawarich.tylercash.dev`) && (ClientIP(`10.0.0.0/8`) || ClientIP(`172.19.0.0/24`))
      - traefik.http.routers.dawarich.entrypoints=websecure
      - traefik.http.services.dawarich.loadbalancer.server.scheme=http
      - traefik.http.services.dawarich.loadbalancer.server.port=3000
      - traefik.http.routers.dawarich.tls.certresolver=leresolver
      - com.centurylinklabs.watchtower.enable=true

  dawarich_sidekiq:
    <<: *logging
    image: freikin/dawarich:latest@sha256:fbc674ec6dbff19b1c9582aefe2e7867b871f42758d21cf339ec70283d51dea6
    container_name: dawarich_sidekiq
    volumes:
      - /ssd/services/dawarich/public:/var/app/public
      - /ssd/services/dawarich/watched:/var/app/tmp/imports/watched
      - /ssd/services/dawarich/storage:/var/app/storage
    networks:
      - homelab_default
    stdin_open: true
    tty: true
    entrypoint: sidekiq-entrypoint.sh
    command: ["sidekiq"]
    restart: unless-stopped
    environment:
      - RAILS_ENV=production
      - REDIS_URL=redis://dawarich_redis:6379
      - DATABASE_HOST=dawarich_db
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=dawarich_production
      - APPLICATION_HOSTS=dawarich.tylercash.dev
      - BACKGROUND_PROCESSING_CONCURRENCY=3
      - APPLICATION_PROTOCOL=https
      - PROMETHEUS_EXPORTER_ENABLED=false
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - RAILS_LOG_TO_STDOUT=true
      - SELF_HOSTED=true
      - STORE_GEODATA=true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq"]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich_db:
        condition: service_healthy
        restart: true
      dawarich_redis:
        condition: service_healthy
        restart: true
      dawarich_app:
        condition: service_healthy
        restart: true

networks:
  homelab_default:
    external: true
