; Override of upstream's assets/packaging/Docker/supervisord.conf (identical in
; v2.2.0 and v2.3.0-RC1), bind-mounted over /etc/supervisord.conf.
;
; The ONLY change is `-localhost` on Xtigervnc: the VNC server has no auth
; (-SecurityTypes None), and upstream binds it to every interface, so any
; container on homelab_default could drive the machine over raw VNC. With
; -localhost it only accepts loopback connections, i.e. easy-novnc in this
; same container. The browser UI on 8080 is the only way in.
;
; If upstream changes this file, re-diff against the new tag before bumping.

[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid

[program:x11]
priority=0
command=/usr/bin/Xtigervnc -desktop "CarveraController" -rfbport 5900 -localhost -SecurityTypes None -AlwaysShared -AcceptKeyEvents -AcceptPointerEvents -AcceptSetDesktopSize -SendCutText -AcceptCutText :0
autorestart=true
redirect_stderr=true

[program:easy-novnc]
priority=0
command=/usr/local/bin/easy-novnc --verbose --addr :8080 --host localhost --port 5900 --no-url-password --novnc-params "resize=remote,reconnect_delay=500"
autorestart=true
redirect_stderr=true

[program:openbox]
priority=1
command=/usr/bin/openbox
environment=DISPLAY=:0
autorestart=true
redirect_stderr=true

[program:carveracontroller]
priority=1
environment=DISPLAY=:0
command=/bin/bash -c '/CarveraController/carveracontroller.appimage --appimage-extract-and-run -a'
autorestart=true
redirect_stderr=true
